<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - WMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="justify-content: center; align-items: center; background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);">

    <div class="card" style="width: 100%; max-width: 480px; box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); margin: 2rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2.2rem;">📝</div>
            <h2 style="color: var(--primary-hover); font-weight: 700; margin-top: 0.5rem;">Đăng Ký Tài Khoản</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Hệ thống sẽ gửi mã OTP xác thực qua Email</p>
        </div>

        <form id="form-register" onsubmit="xuLyDangKy(event)">
            <div class="form-group">
                <label class="form-label">Họ và tên: *</label>
                <input type="text" id="reg-hoten" class="form-control" required placeholder="Nguyễn Văn B">
            </div>

            <div class="form-group">
                <label class="form-label">Tên đăng nhập: *</label>
                <input type="text" id="reg-username" class="form-control" required placeholder="nguyenvanb">
            </div>

            <div class="form-group">
                <label class="form-label">Email nhận OTP: *</label>
                <input type="email" id="reg-email" class="form-control" required placeholder="nguyenvanb@gmail.com">
            </div>

            <div class="form-group">
                <label class="form-label">Số điện thoại:</label>
                <input type="tel" id="reg-sdt" class="form-control" placeholder="0987654321">
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu: *</label>
                <input type="password" id="reg-password" class="form-control" required placeholder="Tối thiểu 6 ký tự">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 0.5rem;">
                🚀 Đăng Ký & Nhận OTP
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.2rem; border-top: 1px solid var(--border-color); text-align: center;">
            <p style="font-size: 0.9rem; color: var(--text-muted);">
                Đã có tài khoản? <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Đăng nhập</a>
            </p>
        </div>
    </div>

    <script>
        async function xuLyDangKy(e) {
            e.preventDefault();
            const hoTen = document.getElementById('reg-hoten').value;
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const sdt = document.getElementById('reg-sdt').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch('/api/dang-ky', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tenDangNhap: username,
                        matKhau: password,
                        hoTen: hoTen,
                        email: email,
                        soDienThoai: sdt
                    })
                });

                const data = await res.json();
                if (data.thanhCong) {
                    alert('🎉 ' + data.thongBao);
                    window.location.href = `verify-otp.html?email=${encodeURIComponent(email)}`;
                } else {
                    alert('❌ ' + data.thongBao);
                }
            } catch (err) {
                alert('Lỗi kết nối máy chủ!');
            }
        }
    </script>
</body>
</html>
