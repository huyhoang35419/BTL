<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - WMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="justify-content: center; align-items: center; background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);">

    <div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); margin: 2rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2.2rem;">🔑</div>
            <h2 style="color: var(--primary-hover); font-weight: 700; margin-top: 0.5rem;">Quên Mật Khẩu</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Nhập email đăng ký để nhận mã OTP khôi phục</p>
        </div>

        <form id="form-forgot" onsubmit="xuLyQuenMatKhau(event)">
            <div class="form-group">
                <label class="form-label">Email tài khoản:</label>
                <input type="email" id="forgot-email" class="form-control" required placeholder="admin@wms.com">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 0.5rem;">
                📩 Gửi Mã OTP Xác Thực
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="login.html" style="color: var(--primary); font-size: 0.9rem; text-decoration: none;">← Quay lại Đăng nhập</a>
        </div>
    </div>

    <script>
        async function xuLyQuenMatKhau(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;

            try {
                const res = await fetch('/api/quen-mat-khau', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await res.json();
                if (data.thanhCong) {
                    alert('🎉 ' + data.thongBao);
                    window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
                } else {
                    alert('❌ ' + data.thongBao);
                }
            } catch (err) {
                alert('Lỗi kết nối máy chủ!');
            }
        }
    </script>
</body>
</html>
