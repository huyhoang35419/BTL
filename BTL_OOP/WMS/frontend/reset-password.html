<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - WMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="justify-content: center; align-items: center; background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);">

    <div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); margin: 2rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2.2rem;">🔄</div>
            <h2 style="color: var(--primary-hover); font-weight: 700; margin-top: 0.5rem;">Đặt Lại Mật Khẩu</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Nhập mã OTP và mật khẩu mới của bạn</p>
        </div>

        <form id="form-reset" onsubmit="xuLyDatLaiMatKhau(event)">
            <div class="form-group">
                <label class="form-label">Email:</label>
                <input type="email" id="reset-email" class="form-control" required readonly>
            </div>

            <div class="form-group">
                <label class="form-label">Mã OTP (6 chữ số):</label>
                <input type="text" id="reset-otp" class="form-control" required maxlength="6" style="letter-spacing: 4px; text-align: center; font-size: 1.2rem;" placeholder="______">
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu mới:</label>
                <input type="password" id="reset-newpass" class="form-control" required placeholder="Nhập mật khẩu mới">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 0.5rem;">
                💾 Lưu Mật Khẩu Mới
            </button>
        </form>

        <div style="margin-top: 1.2rem; background: var(--primary-light); padding: 10px; border-radius: var(--radius-sm); font-size: 0.85rem; text-align: center;">
            <button class="btn btn-outline btn-sm" onclick="layMaOTPTuServer()">🔍 Xem mã OTP vừa tạo</button>
            <div id="reset-otp-demo" style="margin-top: 4px; font-weight: 700; color: var(--primary);"></div>
        </div>

        <div style="margin-top: 1.2rem; text-align: center;">
            <a href="login.html" style="color: var(--primary); font-size: 0.9rem; text-decoration: none;">← Quay lại Đăng nhập</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('reset-email').value = email;
        }

        async function layMaOTPTuServer() {
            const em = document.getElementById('reset-email').value;
            if (!em) return;
            try {
                const res = await fetch(`/api/lay-otp-hien-tai?email=${encodeURIComponent(em)}`);
                const data = await res.json();
                if (data.otp) {
                    document.getElementById('reset-otp-demo').innerText = `Mã OTP: ${data.otp}`;
                    document.getElementById('reset-otp').value = data.otp;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function xuLyDatLaiMatKhau(e) {
            e.preventDefault();
            const em = document.getElementById('reset-email').value;
            const otp = document.getElementById('reset-otp').value;
            const passMoi = document.getElementById('reset-newpass').value;

            try {
                const res = await fetch('/api/dat-lai-mat-khau', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: em, otp: otp, matKhauMoi: passMoi })
                });

                const data = await res.json();
                if (data.thanhCong) {
                    alert('🎉 ' + data.thongBao);
                    window.location.href = 'login.html';
                } else {
                    alert('❌ ' + data.thongBao);
                }
            } catch (err) {
                alert('Lỗi kết nối máy chủ!');
            }
        }
    </script>
</body>
</html>
